name: CI

# kynalyzer (the Kyte Language Server) is a pure-Zig binary with NO LLVM link and NO native runtime: it
# compiles the Kyte compiler's parser/analysis (src/root.zig) as a Zig module and answers LSP requests.
# That makes its CI far lighter than lang's -- no LLVM to install, and it cross-compiles to every
# OS/arch from a single host with the bundled Zig toolchain alone.
#
# kynalyzer needs the `kyte` (lang) repo checked out as a SIBLING so `-Dkyte-src` can point at its
# src/root.zig. If `kyte` is private, set the KYTE_TOKEN secret to a PAT with read access (else the
# checkout falls back to GITHUB_TOKEN, which works when both repos share an owner and it is permitted).
#
# NOTE on `zig build` vs `zig build test`: the DEFAULT `zig build` runs an install step that shells out
# to `sh` (Unix-only), so CI uses `zig build test` (sh-free, runs the suite) and `zig build cross`
# (sh-free, builds every target). Neither touches the sh install path, so both run on Windows too.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One Linux host proves kynalyzer COMPILES for all six OS/arch -- the payoff of being LLVM-free.
  cross-build:
    name: cross-build (all 6 targets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: kynalyzer }
      - uses: actions/checkout@v4
        with:
          repository: kamlesh-nb/nova
          path: lang
          token: ${{ secrets.KYTE_TOKEN || github.token }}
      - uses: mlugg/setup-zig@v2
        with: { version: 0.16.0 }
      - name: Cache Zig build cache
        uses: actions/cache@v4
        with:
          path: kynalyzer/.zig-cache
          key: zigcache-kynalyzer-cross-${{ hashFiles('kynalyzer/build.zig', 'kynalyzer/build.zig.zon', 'kynalyzer/src/**') }}
          restore-keys: zigcache-kynalyzer-cross-
      - name: zig build cross (aarch64/x86_64 x linux/macos/windows)
        working-directory: kynalyzer
        run: zig build cross -Dkyte-src=../lang/src/root.zig

  # Native hosts run the test suite. `zig build test` executes the tests on that OS/arch.
  test:
    name: test ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,   runner: ubuntu-latest }
          - { name: linux-arm64,    runner: ubuntu-24.04-arm }
          - { name: macos-arm64,    runner: macos-14 }
          - { name: macos-x86_64,   runner: macos-13 }
          - { name: windows-x86_64, runner: windows-latest }
    steps:
      - uses: actions/checkout@v4
        with: { path: kynalyzer }
      - uses: actions/checkout@v4
        with:
          repository: kamlesh-nb/nova
          path: lang
          token: ${{ secrets.KYTE_TOKEN || github.token }}
      - uses: mlugg/setup-zig@v2
        with: { version: 0.16.0 }
      - name: Cache Zig build cache
        uses: actions/cache@v4
        with:
          path: kynalyzer/.zig-cache
          key: zigcache-kynalyzer-${{ matrix.name }}-${{ hashFiles('kynalyzer/build.zig', 'kynalyzer/build.zig.zon', 'kynalyzer/src/**') }}
          restore-keys: zigcache-kynalyzer-${{ matrix.name }}-
      - name: zig build test
        working-directory: kynalyzer
        run: zig build test -Dkyte-src=../lang/src/root.zig
